name: Android CI Bionic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone libadrenotools specific commit
        run: |
          rm -rf app/src/main/cpp/adrenotools
          git clone https://github.com/Pipetto-crypto/libadrenotools.git \
            app/src/main/cpp/adrenotools
          cd app/src/main/cpp/adrenotools
          git checkout 8483dfdaa2abf97ee89ad0e5f337e7b508550c6b

      - name: Clone linkernsbypass inside adrenotools
        run: |
          mkdir -p app/src/main/cpp/adrenotools/lib
          git clone https://github.com/Pipetto-crypto/liblinkernsbypass.git \
            app/src/main/cpp/adrenotools/lib/linkernsbypass

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools ninja-build zstd

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bionic-Build-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload APK to GoFile
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$APK"
          SERVER_JSON="$(curl -fsSL https://api.gofile.io/servers)"
          SERVER="$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["data"]["servers"][0]["name"])' <<<"$SERVER_JSON")"
          RESPONSE="$(curl -fsSL -F "file=@$APK" "https://$SERVER.gofile.io/contents/uploadfile")"
          LINK="$(python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok", d; print(d["data"]["downloadPage"])' <<<"$RESPONSE")"
          echo "GOFILE_URL=$LINK" >> "$GITHUB_ENV"
          echo "### APK Winlator Frosted Glass" >> "$GITHUB_STEP_SUMMARY"
          echo "$LINK" >> "$GITHUB_STEP_SUMMARY"
          echo "GoFile: $LINK"
